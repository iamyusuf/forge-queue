[workspace]
members = ["forge-core"]

[package]
name = "forge-queue"
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.0", features = ["serde", "v4"] }

[dependencies]
forge-core = { path = "forge-core" }
uuid = { version = "1.0", features = ["serde", "v4"] }
serde_json = "1.0"
